name: Review upstream skills

on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

# Detection and candidate validation never receive a write-capable token.
permissions:
  contents: read

concurrency:
  group: upstream-skills-review
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.prepare.outputs.changed }}
      base: ${{ steps.prepare.outputs.base }}
      patch_sha256: ${{ steps.prepare.outputs.patch_sha256 }}
    steps:
      # Always run the trusted default-branch scripts, including on manual dispatch.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Review configured sources and prepare a data-only candidate
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/upstream-review"
          if ! node scripts/review-upstreams.mjs 2>&1 | tee "$RUNNER_TEMP/upstream-review/review.md"; then
            cat "$RUNNER_TEMP/upstream-review/review.md" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          npm run check
          node scripts/upstreams.mjs vendor-roots > "$RUNNER_TEMP/upstream-approved-roots"
          mapfile -t approved < "$RUNNER_TEMP/upstream-approved-roots"
          git add -- "${approved[@]}"
          if git diff --cached --quiet -- "${approved[@]}"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/upstream-review/review.md" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          printf '\n## Diff summary\n\n```text\n' >> "$RUNNER_TEMP/upstream-review/review.md"
          git diff --cached --stat -- "${approved[@]}" >> "$RUNNER_TEMP/upstream-review/review.md"
          printf '\n```\n\nManual review required. No automatic merge or installation.\n' >> "$RUNNER_TEMP/upstream-review/review.md"
          git diff --cached --binary -- "${approved[@]}" > "$RUNNER_TEMP/upstream-review/candidate.patch"
          echo "patch_sha256=$(sha256sum "$RUNNER_TEMP/upstream-review/candidate.patch" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/upstream-review/review.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate candidate without installing upstream dependencies
        if: steps.prepare.outputs.changed == 'true'
        run: |
          npm test
      # Always retain the candidate, including failed validation. Publish requires success.
      - name: Save candidate and review summary
        if: always() && (steps.prepare.outputs.changed == 'true' || failure())
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-review
          path: ${{ runner.temp }}/upstream-review/
          if-no-files-found: warn
          retention-days: 30

  propose:
    needs: candidate
    if: needs.candidate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # GitHub/org policy may still deny PR creation. Never change that policy.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.candidate.outputs.base }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: upstream-review
          path: ${{ runner.temp }}/upstream-review
      - name: Propose a draft, or leave an artifact for manual review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PATCH_SHA256: ${{ needs.candidate.outputs.patch_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          fallback() {
            echo '### Manual review available' >> "$GITHUB_STEP_SUMMARY"
            echo 'Could not create the draft PR with the repository token. No repository settings were changed. Download the candidate patch and version summary from this run’s artifact; inspect it before applying.' >> "$GITHUB_STEP_SUMMARY"
          }
          propose() {
            [[ "$PATCH_SHA256" =~ ^[0-9a-f]{64}$ ]] || return 1
            printf '%s  %s\n' "$PATCH_SHA256" "$RUNNER_TEMP/upstream-review/candidate.patch" | sha256sum --check --status || return 1
            branch="automation/skills-upstream-$PATCH_SHA256"
            # Closed or merged PRs count too: do not reopen rejected candidates every week.
            existing=$(gh pr list --state all --head "$branch" --json url --jq '.[0].url // empty') || return 1
            if [[ -n "$existing" ]]; then
              echo "This candidate already has a review: $existing" >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi
            # Private repositories need the same ephemeral credentials for the read and push.
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            remote=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
              ls-remote --heads origin "refs/heads/$branch") || return 1
            if [[ -n "$remote" ]]; then
              echo 'The review branch already exists without a known PR; verify it manually.' >> "$GITHUB_STEP_SUMMARY"
              return 1
            fi
            git switch -c "$branch" || return 1
            # Read allowlisted paths from the trusted base checkout, not from the patch.
            node scripts/upstreams.mjs vendor-roots > "$RUNNER_TEMP/upstream-approved-roots" || return 1
            mapfile -t approved < "$RUNNER_TEMP/upstream-approved-roots" || return 1
            git apply --index "$RUNNER_TEMP/upstream-review/candidate.patch" || return 1
            while IFS= read -r -d '' file; do
              allowed=false
              for root in "${approved[@]}"; do
                if [[ "$file" == "$root/"* ]]; then allowed=true; break; fi
              done
              [[ "$allowed" == true ]] || return 1
            done < <(git diff --cached --no-renames --name-only -z)
            git diff --cached --quiet && return 1
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              -c core.hooksPath=/dev/null commit -m "Review upstream skills ${PATCH_SHA256:0:12}" || return 1
            # Ephemeral HTTP auth; never persist credentials or force-push a review branch.
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
              -c core.hooksPath=/dev/null push origin "HEAD:refs/heads/$branch" || return 1
            url=$(gh pr create --draft --base "$DEFAULT_BRANCH" --head "$branch" \
              --title "Review upstream skills ${PATCH_SHA256:0:12}" \
              --body-file "$RUNNER_TEMP/upstream-review/review.md") || return 1
            echo "Draft review created: $url. Human approval and merge are required." >> "$GITHUB_STEP_SUMMARY"
          }
          if ! propose; then fallback; fi
